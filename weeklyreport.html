<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Report · Alstick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alstick">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<script>if (sessionStorage.getItem("alstick_ok") !== "1") location.replace("index.html");</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal.js?v=8"></script>
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<main>
  <div class="page-title">Weekly Report</div>
  <div class="page-sub" id="period"></div>
  <div class="card"><div class="card-label">Calls</div><div class="card-value">&mdash;</div></div>
  <div class="card"><div class="card-label">Talk time</div><div class="card-value">&mdash;</div></div>
  <div class="card"><div class="card-label">Notes</div><div class="empty">No data yet.</div></div>
</main>
<script src="app.js?v=8"></script>
<script>
  const fmt = (d, o) => d.toLocaleDateString("en-US", o);
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  document.getElementById("period").textContent = fmt(start, { month: "short", day: "numeric" }) + " – " + fmt(end, { month: "short", day: "numeric", year: "numeric" });
</script>
</body>
</html>
