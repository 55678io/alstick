<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alstick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alstick">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<script>if (sessionStorage.getItem("alstick_ok") !== "1") location.replace("index.html");</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal.js?v=8"></script>
<link rel="stylesheet" href="app.css?v=11">
<link rel="stylesheet" href="report.css?v=1">
<style>
  main.home { padding: 0; display: block; }
  .hero { position: relative; height: 56vh; min-height: 340px; border-bottom: 1px solid #000; }
  .hero #net { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
  .hero-tag { position: absolute; left: 16px; bottom: 14px; font-size: 11px; letter-spacing: 1px; color: #444; pointer-events: none; }
  .hero-tag b { color: #111; }
  .sec-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; margin: 22px 0 10px; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #000; border-radius: 14px; overflow: hidden; }
  .status > div { padding: 12px; border-right: 1px solid #000; }
  .status > div:last-child { border-right: 0; }
  .s-label { font-size: 10px; letter-spacing: .8px; color: #666; }
  .s-value { font-size: 15px; font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
  .dot.ok { background: rgb(37,99,235); box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
  .dot.bad { background: #dc2626; }
  .glance .stat canvas { height: 64px; }
  .glance .stat-value { font-size: 28px; }
  .links { display: grid; gap: 10px; }
  @media (min-width: 760px) { .links { grid-template-columns: repeat(3, 1fr); } }
  .link-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid #000; border-radius: 14px; padding: 14px 16px; color: #111; text-decoration: none; background: #fff; }
  .link-card:active { background: #f4f4f4; }
  .lc-title { font-weight: 700; font-size: 16px; }
  .lc-sub { font-size: 12px; color: #666; margin-top: 2px; }
  .arrow { font-size: 20px; }
</style>
</head>
<body>
<main class="home">
  <section class="hero">
    <canvas id="net" aria-label="Animated 3D network globe"></canvas>
    <div class="hero-tag mono"><b>ALSTICK</b> &middot; NETWORK OVERVIEW &middot; DRAG TO ROTATE</div>
  </section>

  <div class="report" style="padding-top:4px">
    <div class="sec-title mono">STATUS</div>
    <div class="status mono">
      <div><div class="s-label">NETWORK</div><div class="s-value"><span class="dot" id="netDot"></span><span id="netText">&mdash;</span></div></div>
      <div><div class="s-label">NOTIFICATIONS</div><div class="s-value"><span class="dot" id="ntfDot"></span><span id="ntfText">Off</span></div></div>
      <div><div class="s-label">LOCAL TIME</div><div class="s-value" id="clock">&mdash;</div></div>
    </div>

    <div class="sec-title mono">AT A GLANCE</div>
    <section class="stats glance" id="glance"></section>

    <div class="sec-title mono">REPORTS</div>
    <div class="links">
      <a class="link-card" href="dailyreport.html"><div><div class="lc-title">Today's Report</div><div class="lc-sub mono" id="p-d"></div></div><span class="arrow">&rarr;</span></a>
      <a class="link-card" href="weeklyreport.html"><div><div class="lc-title">Weekly Report</div><div class="lc-sub mono" id="p-w"></div></div><span class="arrow">&rarr;</span></a>
      <a class="link-card" href="monthlyreport.html"><div><div class="lc-title">Monthly Report</div><div class="lc-sub mono" id="p-m"></div></div><span class="arrow">&rarr;</span></a>
    </div>
  </div>
</main>
<script src="app.js?v=11"></script>
<script src="stats.js?v=1"></script>
<script src="viz3d.js?v=2"></script>
<script src="network.js?v=2"></script>
<script>
  // Network status (from the browser)
  const netDot = document.getElementById("netDot"), netText = document.getElementById("netText");
  const setNet = () => {
    netDot.className = "dot " + (navigator.onLine ? "ok" : "bad");
    netText.textContent = navigator.onLine ? "Online" : "Offline";
  };
  addEventListener("online", setNet); addEventListener("offline", setNet); setNet();

  // Notification status
  const ntfDot = document.getElementById("ntfDot"), ntfText = document.getElementById("ntfText");
  const setNtf = on => { ntfDot.className = "dot" + (on ? " ok" : ""); ntfText.textContent = on ? "On" : "Off"; };
  window.OneSignalDeferred.push(async OneSignal => {
    const ps = OneSignal.User.PushSubscription;
    setNtf("Notification" in window && Notification.permission === "granted" && ps.optedIn);
    ps.addEventListener("change", e => setNtf(!!(e.current && e.current.optedIn)));
  });

  // Live clock
  const clock = document.getElementById("clock");
  const tick = () => { clock.textContent = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); };
  tick(); setInterval(tick, 10000);

  // At a glance
  const S = window.ALSTICK_STATS;
  const shapes = { H: ["cube"], V: ["octa", "red"], SL: null, A: ["icosa"] };
  document.getElementById("glance").innerHTML = Object.keys(S).map(k =>
    '<a class="stat" href="dailyreport.html" style="color:inherit;text-decoration:none"><canvas id="g-' + k + '"></canvas>' +
    '<div class="stat-label mono">' + S[k].label + '</div>' +
    '<div class="stat-value mono">' + S[k].value + (S[k].unit ? "<small>" + S[k].unit + "</small>" : "") + "</div></a>"
  ).join("");
  Object.keys(S).forEach(k => {
    const c = document.getElementById("g-" + k);
    if (shapes[k]) Viz.wire(c, shapes[k][0], shapes[k][1]); else Viz.gauge(c, S[k].value);
  });

  // Report periods
  const now = new Date(), fmt = (d, o) => d.toLocaleDateString("en-US", o);
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  document.getElementById("p-d").textContent = fmt(now, { weekday: "short", month: "short", day: "numeric" });
  document.getElementById("p-w").textContent = fmt(start, { month: "short", day: "numeric" }) + " – " + fmt(end, { month: "short", day: "numeric" });
  document.getElementById("p-m").textContent = fmt(now, { month: "long", year: "numeric" });
</script>
</body>
</html>
