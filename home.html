<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alstick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alstick">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<script>if (sessionStorage.getItem("alstick_ok") !== "1") location.replace("index.html");</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal.js?v=7"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111; }
  body { display: flex; flex-direction: column; min-height: 100%; animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; } }

  /* Header */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px; padding-top: env(safe-area-inset-top);
    height: calc(60px + env(safe-area-inset-top));
    background: #fff; border-bottom: 1px solid #000;
    position: sticky; top: 0; z-index: 10;
  }
  .brand { height: 36px; width: auto; display: block; }
  .brand-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .menu-btn {
    width: 40px; height: 40px; border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
  }
  .menu-btn span { display: block; width: 22px; height: 2px; background: #111; border-radius: 2px; }

  /* Main */
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  h1 { font-size: 24px; font-weight: 600; }

  /* Footer */
  footer {
    background: #fff; border-top: 1px solid #000;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
    text-align: center; font-size: 13px; color: #555;
  }

  /* Left side menu */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 270px; max-width: 80vw;
    background: #fff; border-right: 1px solid #000; z-index: 30;
    transform: translateX(-100%); transition: transform .25s ease;
    padding-top: env(safe-area-inset-top);
    display: flex; flex-direction: column;
  }
  body.menu-open .overlay { opacity: 1; pointer-events: auto; }
  body.menu-open .drawer { transform: translateX(0); }
  .drawer-head { height: 60px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #000; font-weight: 700; }
  .menu-item {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 16px; font-size: 16px; text-align: left; background: #fff; color: #111;
    border: 0; border-bottom: 1px solid #eee; cursor: pointer;
  }
  .menu-item:active { background: #f4f4f4; }
  .check { font-weight: 700; visibility: hidden; }
  .menu-item.on .check { visibility: visible; }
  #status { padding: 10px 16px; font-size: 13px; color: #666; }
</style>
</head>
<body>
  <header>
    <img class="brand" src="Boku.png" alt="Alstick" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-text',textContent:'Alstick'}))">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="drawer" aria-expanded="false"><span></span><span></span><span></span></button>
  </header>

  <main>
    <h1>Welcome</h1>
  </main>

  <footer>&copy; <span id="year"></span> Alstick</footer>

  <div class="overlay" id="overlay"></div>
  <nav class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-head">Menu</div>
    <button class="menu-item" id="notify">
      <span>Enable notifications</span>
      <span class="check" aria-hidden="true">&#10003;</span>
    </button>
    <div id="status"></div>
  </nav>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  // Left side menu
  const menuBtn = document.getElementById("menuBtn");
  const setMenu = open => {
    document.body.classList.toggle("menu-open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
  };
  menuBtn.onclick = () => setMenu(!document.body.classList.contains("menu-open"));
  document.getElementById("overlay").onclick = () => setMenu(false);

  // Notifications
  const status = document.getElementById("status");
  const btn = document.getElementById("notify");
  const say = t => { status.textContent = t; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const markOn = () => { btn.classList.add("on"); say(""); };

  // Show the check mark if this device is already subscribed
  window.OneSignalDeferred.push(async OneSignal => {
    const ps = OneSignal.User.PushSubscription;
    if ("Notification" in window && Notification.permission === "granted" && ps.optedIn) markOn();
    ps.addEventListener("change", e => { if (e.current && e.current.optedIn) markOn(); });
  });

  function subscribe() {
    window.OneSignalDeferred.push(async OneSignal => {
      try {
        if (window.__osError) { say("Something went wrong. Please try again."); return; }
        await OneSignal.User.PushSubscription.optIn();
        // The subscription ID can take a few seconds to arrive from the server
        for (let i = 0; i < 15 && !(OneSignal.User.PushSubscription.id && OneSignal.User.PushSubscription.token); i++) await sleep(1000);
        if (OneSignal.User.PushSubscription.id && OneSignal.User.PushSubscription.token) markOn();
        else say("Something went wrong. Please try again.");
      } catch (e) {
        console.error(e);
        say("Something went wrong. Please try again.");
      }
    });
  }

  btn.onclick = async () => {
    say("");
    if (!("Notification" in window)) {
      const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
      if (iOS && !standalone) say("On iPhone: tap Share, then \"Add to Home Screen,\" and open Alstick from your Home Screen.");
      else say("This browser doesn't support notifications.");
      return;
    }
    let perm = Notification.permission;
    // Permission must be requested directly from the click (required by Safari)
    if (perm === "default") perm = await Notification.requestPermission();
    if (perm === "granted") subscribe();
    else if (perm === "denied") say("Notifications are blocked. Allow them for this site in your browser settings.");
  };
</script>
</body>
</html>
