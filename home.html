<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alstick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alstick">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<script>if (sessionStorage.getItem("alstick_ok") !== "1") location.replace("index.html");</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal.js?v=5"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; } }
  .logo { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  h1 { font-size: 22px; font-weight: 600; }
  button { padding: 12px 22px; font-size: 15px; border: 1.5px solid #111; border-radius: 12px; background: #fff; cursor: pointer; }
  button:active { background: #111; color: #fff; }
  #status { font-size: 13px; color: #666; max-width: 520px; word-break: break-word; }
</style>
</head>
<body>
  <div class="logo">Alstick</div>
  <h1>Welcome</h1>
  <button id="notify">Enable notifications</button>
  <div id="status"></div>
<script>
  const status = document.getElementById("status");
  const btn = document.getElementById("notify");
  const say = t => { status.textContent = t; };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function diag(OneSignal) {
    const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
    const ps = OneSignal.User.PushSubscription;
    return "init: " + (window.__osError ? "ERROR " + window.__osError : (window.__osReady ? "ok" : "pending")) +
      " | permission: " + Notification.permission +
      " | optedIn: " + ps.optedIn +
      " | id: " + (ps.id || "none") +
      " | token: " + (ps.token ? "yes" : "none") +
      " | SW: " + (regs.map(r => r.scope).join(", ") || "none");
  }

  function subscribe() {
    say("Subscribe ho raha hai…");
    const timer = setTimeout(() => say("OneSignal load nahi hua — page reload karke dobara try karein"), 10000);
    window.OneSignalDeferred.push(async OneSignal => {
      clearTimeout(timer);
      try {
        if (window.__osError) { say("OneSignal init error: " + window.__osError); return; }
        await OneSignal.User.PushSubscription.optIn();
        // Server se subscription ID aane me kuch second lag sakte hain
        for (let i = 0; i < 15 && !(OneSignal.User.PushSubscription.id && OneSignal.User.PushSubscription.token); i++) await sleep(1000);
        const ok = OneSignal.User.PushSubscription.id && OneSignal.User.PushSubscription.token;
        say((ok ? "Notifications ON ✓  " : "Subscribe poora nahi hua.  ") + "[" + await diag(OneSignal) + "]");
      } catch (e) {
        say("Error: " + (e && e.message ? e.message : e) + "  [" + await diag(OneSignal).catch(() => "") + "]");
      }
    });
  }

  if ("Notification" in window && Notification.permission === "granted") say("Permission di hui hai ✓");

  btn.onclick = async () => {
    if (!("Notification" in window)) {
      const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
      if (iOS && !standalone) say("iPhone par: Safari me Share (⬆️) → \"Add to Home Screen\" dabaiye, phir Home Screen par Alstick icon se app kholkar yahan dobara dabaiye.");
      else say("Ye browser web notifications support nahi karta (iPhone par iOS 16.4+ chahiye)");
      return;
    }
    let perm = Notification.permission;
    // Permission seedha click par maangna zaroori hai (Safari isi ko allow karta hai)
    if (perm === "default") perm = await Notification.requestPermission();
    if (perm === "granted") subscribe();
    else if (perm === "denied") say("Notifications blocked hain — browser settings me is site ke liye Allow karein");
    else say("Permission nahi mili");
  };
</script>
</body>
</html>
