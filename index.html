<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Alstick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alstick">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal.js?v=7"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; transition: opacity .5s ease; }
  .hidden { opacity: 0; pointer-events: none; }

  /* Splash logo animation */
  .logo { font-size: 44px; font-weight: 800; letter-spacing: -1px; color: #111; }
  .splash-logo { animation: logoIn 1.6s cubic-bezier(.2,.8,.2,1) both; }
  img.splash-logo { width: 160px; max-width: 45vw; height: auto; }
  @keyframes logoIn {
    0%   { opacity: 0; transform: scale(.3) rotate(-12deg); }
    60%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
    80%  { transform: scale(.97) rotate(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* PIN login */
  #login h1 { font-size: 20px; font-weight: 600; margin-bottom: 28px; }
  .pins { display: flex; gap: 10px; }
  .pins input { width: 46px; height: 56px; text-align: center; font-size: 24px; border: 1.5px solid #ddd; border-radius: 12px; outline: none; background: #fff; transition: border-color .2s; }
  .pins input:focus { border-color: #111; }
  .pins.error input { border-color: #e53935; animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #msg { height: 20px; margin-top: 16px; font-size: 14px; color: #e53935; }

  /* Loader */
  .spinner { width: 44px; height: 44px; border: 4px solid #eee; border-top-color: #111; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { margin-top: 16px; font-size: 14px; color: #666; }
</style>
</head>
<body>
  <div id="splash" class="screen"><img class="splash-logo" src="Boku.png" alt="Alstick" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo splash-logo',textContent:'Alstick'}))"></div>

  <div id="login" class="screen hidden">
    <h1>Enter your 6-digit PIN</h1>
    <div class="pins" id="pins">
      <input inputmode="numeric" maxlength="1" type="password" autocomplete="off">
      <input inputmode="numeric" maxlength="1" type="password" autocomplete="off">
      <input inputmode="numeric" maxlength="1" type="password" autocomplete="off">
      <input inputmode="numeric" maxlength="1" type="password" autocomplete="off">
      <input inputmode="numeric" maxlength="1" type="password" autocomplete="off">
      <input inputmode="numeric" maxlength="1" type="password" autocomplete="off">
    </div>
    <div id="msg"></div>
  </div>

  <div id="loading" class="screen hidden"><div class="spinner"></div><p>Loading…</p></div>

<script>
  const PIN = "556221";
  const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("hidden", s.id !== id));
  const inputs = [...document.querySelectorAll("#pins input")];

  // Show splash for 2.5 seconds, then the login screen
  setTimeout(() => { show("login"); inputs[0].focus(); }, 2500);

  inputs.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "").slice(-1);
      if (inp.value && i < 5) inputs[i + 1].focus();
      check();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) inputs[i - 1].focus();
    });
    inp.addEventListener("paste", e => {
      const d = (e.clipboardData.getData("text").match(/\d/g) || []).slice(0, 6);
      if (!d.length) return;
      e.preventDefault();
      d.forEach((c, j) => inputs[j] && (inputs[j].value = c));
      inputs[Math.min(d.length, 5)].focus();
      check();
    });
  });

  function check() {
    const val = inputs.map(i => i.value).join("");
    if (val.length < 6) return;
    if (val === PIN) {
      sessionStorage.setItem("alstick_ok", "1");
      inputs.forEach(i => i.blur());
      show("loading");
      setTimeout(() => location.href = "home.html", 3000);
    } else {
      const box = document.getElementById("pins");
      box.classList.add("error");
      document.getElementById("msg").textContent = "Incorrect PIN. Please try again.";
      setTimeout(() => {
        box.classList.remove("error");
        inputs.forEach(i => i.value = "");
        inputs[0].focus();
      }, 600);
    }
  }
</script>
</body>
</html>
